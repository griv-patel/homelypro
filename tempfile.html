<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoopService - Customer Login</title>
<link rel="stylesheet" href="customerlogin.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo-section">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L20 6V12C20 16.5 16.5 20.5 12 22C7.5 20.5 4 16.5 4 12V6L12 2Z" stroke="white" stroke-width="1.5"/>
          <circle cx="12" cy="11" r="3" stroke="white" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="logo-text">
        <h1>CoopService</h1>
        <span>Cooperative Services Platform</span>
      </div>
    </div>

    <nav class="nav-links">
      <a href="#" class="active">Home</a>
      <a href="#">Services</a>
      <a href="#">How It Works</a>
      <a href="#">About Us</a>
      <a href="#">Become a Worker</a>
      <a href="#">Contact Us</a>
    </nav>

    <div class="header-actions">
      <div class="lang-dropdown">
        <span>English</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2"/></svg>
      </div>
      <button class="btn-login-outline">Login</button>
      <button class="btn-register">Register</button>
    </div>
  </header>

  <!-- Main -->
  <main class="main-wrapper">
    <div class="login-card">

      <div class="card-header">
        <div class="user-icon-circle">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" stroke="#1e7a3d" stroke-width="1.5"/>
            <path d="M4 20C4 16.6863 7.58172 14 12 14C16.4183 14 20 16.6863 20 20" stroke="#1e7a3d" stroke-width="1.5"/>
          </svg>
        </div>
        <h2>Customer Login</h2>
        <p>Access your account to book services and manage requests</p>
      </div>

      <div class="card-body">

        <div class="illustration">
          <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
            <circle cx="150" cy="160" r="140" fill="#eafaf0"/>
            <path d="M40 300 L40 220 L70 220 L70 260 L100 260 L100 210 L140 210 L140 260 L180 260 L180 230 L220 230 L220 300 Z" fill="#dceee0"/>
            <ellipse cx="150" cy="290" rx="90" ry="12" fill="#d5efdd"/>
            <path d="M115 120 Q110 80 150 75 Q195 78 195 120 Q198 150 190 175 L110 175 Q102 150 115 120 Z" fill="#2b2320"/>
            <ellipse cx="150" cy="150" rx="42" ry="48" fill="#ffd7ae"/>
            <circle cx="132" cy="150" r="4" fill="#2b2320"/>
            <circle cx="168" cy="150" r="4" fill="#2b2320"/>
            <path d="M135 168 Q150 178 165 168" stroke="#2b2320" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M108 130 Q100 150 108 175" stroke="#2b2320" stroke-width="10" fill="none" stroke-linecap="round"/>
            <path d="M192 130 Q202 150 196 178" stroke="#2b2320" stroke-width="10" fill="none" stroke-linecap="round"/>
            <path d="M100 200 Q150 185 200 200 L212 300 L88 300 Z" fill="#1e9e50"/>
            <path d="M115 210 Q108 250 118 300" stroke="#178042" stroke-width="10" fill="none" stroke-linecap="round"/>
            <path d="M185 210 L165 240 L190 250 L175 300" stroke="#ffd7ae" stroke-width="18" fill="none" stroke-linecap="round"/>
            <rect x="165" y="235" width="26" height="42" rx="5" fill="#22314a"/>
            <circle cx="70" cy="90" r="30" fill="#eafaf0"/>
            <path d="M55 90 L65 80 L85 80 L85 98 L75 98 L70 106 L65 98 L55 98 Z" fill="none" stroke="#1e9e50" stroke-width="2.5"/>
            <path d="M60 88 L70 80 L80 88 L80 96 L60 96 Z" fill="none" stroke="#1e9e50" stroke-width="2.5"/>
          </svg>
        </div>

        <form class="login-form" id="loginForm">

          <div class="form-group">
            <label for="fullName">Name <span class="required">*</span></label>
            <div class="input-wrapper">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4" stroke="#8a94a6" stroke-width="1.5"/>
                <path d="M4 20C4 16.6863 7.58172 14 12 14C16.4183 14 20 16.6863 20 20" stroke="#8a94a6" stroke-width="1.5"/>
              </svg>
              <input type="text" id="fullName" name="fullName" placeholder="Enter your name">
            </div>
            <span class="error-message" id="fullNameError"></span>
          </div>

          <div class="divider">
            <span></span>
            <p>OR</p>
            <span></span>
          </div>

          <div class="form-group">
            <label for="contact">Mobile Number / Email ID <span class="required">*</span></label>
            <div class="input-wrapper">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="#8a94a6" stroke-width="1.5"/>
                <path d="M3 7L12 13L21 7" stroke="#8a94a6" stroke-width="1.5"/>
              </svg>
              <input type="text" id="contact" name="contact" placeholder="Enter your mobile number or email ID">
            </div>
            <span class="error-message" id="contactError"></span>
            <p class="otp-note">We will send you an OTP to verify and login.</p>
          </div>

          <button type="submit" class="btn-submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M15 3H19C20.1046 3 21 3.89543 21 5V19C21 20.1046 20.1046 21 19 21H15" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M10 17L15 12L10 7" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15 12H3" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            Login
          </button>

        </form>
      </div>
    </div>
  </main>

  <script src="customerlogin.js"></script>
</body>
</html>
